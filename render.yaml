services:
  - type: web
    name: discord-staff-applications
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install --omit=dev
    startCommand: node server.mjs
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: applications-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: OWNER_CODE
        sync: false
